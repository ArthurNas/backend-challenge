x-application-environment: &application-environment
  DATABASE_URL: postgresql://wagering:wagering_local@postgres:5432/wagering
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  SQS_ENDPOINT: http://localstack:4566

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering_local
      POSTGRES_DB: wagering
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering -d wagering"]
      interval: 5s
      timeout: 3s
      retries: 20

  localstack:
    image: localstack/localstack:4.0.3
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
      SQS_ENDPOINT_STRATEGY: dynamic
    ports:
      - "127.0.0.1:4566:4566"
    volumes:
      - ./infra/localstack/init-sqs.sh:/etc/localstack/init/ready.d/init-sqs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs get-queue-url --queue-name wager-transactions.fifo >/dev/null && awslocal sqs get-queue-url --queue-name wager-events.fifo >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  migrate:
    profiles: [app]
    build: .
    environment: *application-environment
    command: [bun, scripts/migrate.ts, up]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: [app]
    build: .
    environment: *application-environment
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy
    healthcheck:
      test: [CMD, bun, -e, "const r = await fetch('http://localhost:3000/health/ready'); process.exit(r.ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    profiles: [app]
    build: .
    environment: *application-environment
    command: [bun, dist/worker-main.js]
    depends_on:
      migrate:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy
    stop_grace_period: 35s
    healthcheck:
      test: [CMD, bun, -e, "const r = await fetch('http://localhost:3001/health/ready'); process.exit(r.ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 20

  tests:
    profiles: [test]
    build: .
    environment:
      <<: *application-environment
      TEST_DATABASE_URL: postgresql://wagering:wagering_local@postgres:5432/postgres
      TEST_SQS_ENDPOINT: http://localstack:4566
    command: [bun, test]
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy

volumes:
  postgres_data:
